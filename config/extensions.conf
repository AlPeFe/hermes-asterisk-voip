[general]
static=yes
writeprotect=yes

; Llamadas entre extensiones de la LAN
[from-internal]
exten => 100,1,Dial(PJSIP/100,30)
 same => n,Hangup()
exten => 101,1,Dial(PJSIP/101,30)
 same => n,Hangup()

; 600: eco (prueba de audio de ida y vuelta)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Echo()

; 700: sonido de bienvenida de Asterisk (prueba de que se oye algo)
exten => 700,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; 800: el mensaje que genera Hermes (custom/hermes.<ext>)
exten => 800,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/hermes)
 same => n,Hangup()

; Contexto usado al originar llamadas (channel originate … extension play@hermes)
;
; OJO: NO se usa ARI para originar. Un canal creado por ARI con app=<x> entra en
; Stasis y, si no hay ningún cliente websocket suscrito a esa app, Asterisk lo
; cuelga al instante ("Stasis app 'hermes' doesn't exist"). `channel originate`
; va directo al dialplan y no necesita a nadie escuchando.
[hermes]
exten => play,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/hermes)
 same => n,Wait(1)
 same => n,Hangup()
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/hermes)
 same => n,Hangup()

; 900: se contesta sola, graba lo que reproduce y cuelga.
; Sirve para verificar el pipeline completo SIN teléfono: el audio queda en
; /var/spool/asterisk/monitor (montado en ~/apps/asterisk/spool/monitor) y se
; puede analizar con ffmpeg para comprobar que no es silencio.
[prueba]
exten => 900,1,Answer()
 same => n,Wait(1)
 same => n,MixMonitor(grabacion.wav)
 same => n,Playback(custom/hermes)
 same => n,Wait(1)
 same => n,StopMixMonitor()
 same => n,Hangup()
